<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Casino Dealer Training</title>

  <!-- Disable browser auto-translate (Chrome/Safari) — casino terms like
       BANKER/PLAYER/DEALER/PAY/TAKE/TIE must never get machine-translated.
       translate="no" (html tag above + body below) is the HTML-spec
       attribute Safari's translator honors; the "google"/"notranslate"
       meta + class cover Chrome's Google Translate specifically. Both
       are inherited by descendants, so every dynamically-rendered game
       screen is covered without touching main.js's game logic. -->
  <meta name="google" content="notranslate" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dealer" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <link href="/style.css" rel="stylesheet">
</head>
<body translate="no" class="notranslate">

  <!-- Portrait blocking overlay -->
  <div id="portrait-block" aria-hidden="true">
    <div class="portrait-content">
      <div class="portrait-icon">↻</div>
      <p class="portrait-title">가로 모드로 사용해주세요</p>
      <p class="portrait-sub">기기를 가로로 돌려주세요.<br>화면 회전 잠금이 설정된 경우 해제해주세요.</p>
    </div>
  </div>

  <!-- Login gate (사번 로그인) -->
  <div id="login-block" aria-hidden="true">
    <form class="login-content" id="login-form">
      <div class="login-title">Casino Dealer<br><span class="gold">Training System</span></div>
      <input id="login-emp-id" class="login-input" type="text" inputmode="numeric"
             autocomplete="off" placeholder="사번을 입력하세요" maxlength="20" aria-label="사번" />
      <button type="submit" id="login-submit-btn" class="login-submit-btn">입장하기</button>
      <p id="login-error" class="login-error" style="display:none"></p>
    </form>
    <div class="login-welcome" id="login-welcome" style="display:none">
      <div class="login-welcome-text">안녕하세요, <span id="login-welcome-name"></span>님 👋</div>
    </div>
  </div>

  <!-- Top bar (always visible) -->
  <div class="top-bar">
    <button class="hamburger-btn" onclick="App.toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <button class="home-btn" onclick="App.navigate('home')" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <polyline points="9 22 9 13 15 13 15 22"/>
      </svg>
    </button>
    <span class="top-bar-title" id="top-bar-title" style="display:none"
          role="button" tabindex="0" aria-label="Home"
          onclick="App.navigate('home')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.navigate('home');}">
      <span class="top-bar-card-icon">
        <span class="top-bar-hero-cards" id="top-bar-hero-cards">
          <!-- Populated by main.js (renderTopBarHeroCards()) via the same
               cardHTML() every game card uses — see that function for why
               this can't be static markup like it used to be. -->
        </span>
      </span>
      Casino Dealer <span class="gold">Training System</span>
    </span>
    <span class="top-bar-user" id="top-bar-user" style="display:none">
      <span class="top-bar-user-name" id="top-bar-user-name"></span>
      <button class="top-bar-logout-btn" id="logout-btn" onclick="Auth.logout()" aria-label="로그아웃">⏻</button>
    </span>
  </div>

  <!-- Sidebar overlay -->
  <div id="sidebar-overlay" onclick="App.closeSidebar()"></div>

  <div class="app-shell">

    <aside class="sidebar">
<nav class="sidebar-nav">

        <div class="sidebar-section">
          <div class="sidebar-section-title">BACCARAT</div>
          <a class="sidebar-sub-link sidebar-sub-item" data-game="baccarat" data-mode="simulation"
             onclick="App.navigate('baccarat','simulation')">Card Drawing</a>
          <a class="sidebar-sub-link sidebar-sub-item" data-game="baccarat" data-mode="paysim"
             onclick="App.navigate('baccarat','paysim')">Payout</a>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-title">BLACKJACK</div>
          <a class="sidebar-sub-link sidebar-sub-item" data-game="blackjack" data-mode="startmenu"
             onclick="App.navigate('blackjack','startmenu')">Card Counting</a>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-title">ROULETTE</div>
          <a class="sidebar-sub-link sidebar-sub-item" data-game="roulette" data-mode="paymenu"
             onclick="App.navigate('roulette','paymenu')">Payout</a>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-title">POKER</div>
          <a class="sidebar-sub-link sidebar-sub-item" data-game="poker" data-mode="startmenu"
             onclick="App.navigate('poker','startmenu')">Hold'em Ranking</a>
        </div>

      </nav>
    </aside>

    <main id="app" class="main-content notranslate" translate="no"></main>

  </div>

  <script src="/main.js"></script>
  <script type="module" src="/firebase-init.js"
          onerror="console.error('[DealerAuth] firebase-init.js 로드 실패 (네트워크 차단/CDN 접근 불가 가능성)'); window.dispatchEvent(new Event('dealerauth-load-error'))"></script>
  <script>
    // Login gate (사번 조회 → users/{employeeId}.active === true)
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      Auth.login(document.getElementById('login-emp-id').value.trim());
    });
    Auth.init();

    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }

    // Portrait blocking
    const block = document.getElementById('portrait-block');
    function checkOrientation() {
      const portrait = window.innerHeight > window.innerWidth;
      block.style.display = portrait ? 'flex' : 'none';
    }
    checkOrientation();
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 100));
  </script>
</body>
</html>
